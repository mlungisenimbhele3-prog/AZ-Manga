name: Build & Publish Signed AZ-OVERVERSE-signed.aab (v1.0.2)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (defaults to v1.0.2)'
        required: false
        default: 'v1.0.2'

concurrency:
  group: build-release-v1-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-android-release:
    name: Build Signed AZ-OVERVERSE-signed.aab (com.azoververse.app v1.0.2)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci || npm install

      - name: Generate Black AZ Launcher Icons & Splash Screens
        run: node scripts/generate-android-assets.cjs

      - name: Build Production Web Application
        run: npm run build

      - name: Sync Capacitor Android Assets
        run: |
          npx cap sync android
          node scripts/generate-android-assets.cjs

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK Licenses & Ensure API 35
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER=""
          if [ -n "$SDK_ROOT" ] && [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null || true
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" > /dev/null || true
          fi

      - name: Prepare Production Upload Keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p android/app
          ALIAS_VAL="${KEY_ALIAS:-azoververse_upload}"
          SPASS_VAL="${STORE_PASS:-AzOverversePlay2026!}"
          KPASS_VAL="${KEY_PASS:-AzOverversePlay2026!}"

          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > android/app/az-oververse-upload.keystore
          elif [ ! -f android/app/az-oververse-upload.keystore ]; then
            keytool -genkeypair -v \
              -storetype PKCS12 \
              -keystore android/app/az-oververse-upload.keystore \
              -alias "$ALIAS_VAL" \
              -keyalg RSA -keysize 2048 -sigalg SHA256withRSA -validity 10000 \
              -storepass "$SPASS_VAL" \
              -keypass "$KPASS_VAL" \
              -dname "CN=Mlungiseni Mbhele, OU=AZ OVERVERSE, O=AZ OVERVERSE, L=Durban, ST=KwaZulu-Natal, C=ZA"
          fi
          test -s android/app/az-oververse-upload.keystore

      - name: Build Signed AZ-OVERVERSE-signed.aab
        id: build_android
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION_CODE=$((102 + ${GITHUB_RUN_NUMBER:-0}))
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_OUTPUT"

          export ANDROID_KEYSTORE_PATH="az-oververse-upload.keystore"
          export ANDROID_KEY_ALIAS="${KEY_ALIAS:-azoververse_upload}"
          export ANDROID_KEYSTORE_PASSWORD="${STORE_PASS:-AzOverversePlay2026!}"
          export ANDROID_KEY_PASSWORD="${KEY_PASS:-AzOverversePlay2026!}"
          export ANDROID_VERSION_CODE="$VERSION_CODE"
          export ANDROID_VERSION_NAME="1.0.2"

          cd android
          chmod +x gradlew
          ./gradlew :app:bundleRelease -x lint -x lintVitalRelease --stacktrace

      - name: Verify Cryptographic Signature & Stage AZ-OVERVERSE-signed.aab
        run: |
          AAB_PATH="android/app/build/outputs/bundle/release/app-release.aab"
          cp "$AAB_PATH" ./AZ-OVERVERSE-signed.aab
          jarsigner -verify -verbose -certs ./AZ-OVERVERSE-signed.aab | head -n 35
          sha256sum AZ-OVERVERSE-signed.aab > SHA256SUMS.txt
          ls -lh AZ-OVERVERSE-signed.aab SHA256SUMS.txt

      - name: Upload Signed AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AZ-OVERVERSE-signed-v1.0.2
          path: |
            AZ-OVERVERSE-signed.aab
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
