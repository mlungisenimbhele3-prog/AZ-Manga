name: Build Signed Release AAB & Publish to GitHub Releases

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-aab:
    name: Build & Release Android App Bundle (.aab)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Generate or Decode Release Keystore
        run: |
          mkdir -p android/app
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore
            echo "Loaded release keystore from GitHub Secret."
          else
            echo "Generating production release keystore..."
            keytool -genkeypair -v \
              -keystore android/app/release.keystore \
              -alias "${{ secrets.ANDROID_KEY_ALIAS || 'azoververse' }}" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'azoververse2026' }}" \
              -keypass "${{ secrets.ANDROID_KEY_PASSWORD || 'azoververse2026' }}" \
              -dname "CN=AZ OVERVERSE, OU=Manga Publishing, O=AZ Oververse, L=Durban, ST=KZN, C=ZA"
          fi

      - name: Build Signed Release AAB with Gradle
        env:
          ANDROID_KEYSTORE_PATH: "release.keystore"
          ANDROID_KEYSTORE_PASSWORD: "${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'azoververse2026' }}"
          ANDROID_KEY_ALIAS: "${{ secrets.ANDROID_KEY_ALIAS || 'azoververse' }}"
          ANDROID_KEY_PASSWORD: "${{ secrets.ANDROID_KEY_PASSWORD || 'azoververse2026' }}"
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --stacktrace

      - name: Verify Signed AAB Artifact
        run: |
          ls -la android/app/build/outputs/bundle/release/
          AAB_FILE=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          if [ -z "$AAB_FILE" ]; then
            echo "Error: Release AAB file not found!"
            exit 1
          fi
          echo "Found release bundle: $AAB_FILE"
          cp "$AAB_FILE" az-oververse-release.aab
          sha256sum az-oververse-release.aab > az-oververse-release.aab.sha256

      - name: Determine Release Tag
        id: tag_name
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.release_tag }}" ]; then
            echo "TAG=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "TAG=v1.0.$(date +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT
          fi

      - name: Publish Release to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_name.outputs.TAG }}
          name: "AZ OVERVERSE Release ${{ steps.tag_name.outputs.TAG }}"
          body: |
            ### AZ OVERVERSE Google Play Store Release 🚀
            **Produced by Mlungiseni Mbhele**

            - **Signed Android App Bundle (AAB)**: Ready for Google Play Console upload (`internal`, `closed`, `open`, or `production` tracks).
            - **Monetization**: 100% compliant with Google Play In-App Billing (Subscriptions & Pulse Coins packs) with 70% direct creator revenue sharing.
            - **Features Included**:
              - User Profile system (Register/Login, Bookmarks shelf, Reading progress auto-save, Preferences)
              - Facebook & TikTok style Social Chat with groups, voice notes, reactions, and creator follows
              - High-performance 120Hz/90Hz rendering & low-end device optimizations
              - Full-screen reader with zoom, touch controls, and dark/AMOLED/sepia themes

            #### SHA-256 Checksum:
            `az-oververse-release.aab`
          files: |
            az-oververse-release.aab
            az-oververse-release.aab.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
