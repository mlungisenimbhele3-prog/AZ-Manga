name: Build Debug APK & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci || npm install

      - name: Build web application
        run: npm run build

      - name: Sync Capacitor Android platform
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false

      - name: Ensure gradlew executable
        run: |
          chmod +x android/gradlew

      - name: Build Debug APK with Gradle (:app:assembleDebug)
        run: |
          cd android
          ./gradlew :app:assembleDebug --stacktrace

      - name: Verify APK output exists
        id: verify-apk
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: $APK_PATH not found!"
            find android/app/build/outputs/apk -name "*.apk" || true
            exit 1
          fi
          echo "APK exists: $(ls -lh $APK_PATH)"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: "Latest Debug Build"
          body: |
            ## 📱 AZ Oververse Debug APK

            Automated build produced by GitHub Actions.

            - **Commit**: `${{ github.sha }}`
            - **Branch/Ref**: `${{ github.ref_name }}`
            - **JDK Version**: Java 21 (Temurin)
            - **Gradle Version**: 9.3.1
            - **Build Task**: `:app:assembleDebug`

            ### ⬇️ Permanent Download Link
            You can always download the latest debug APK directly at:
            **[`/releases/latest/download/app-debug.apk`](${{ github.server_url }}/${{ github.repository }}/releases/latest/download/app-debug.apk)**
          files: android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
